# ==========================================================
# === SWITCHES
# ==========================================================
switch:
  # Emergency OFF (coupure dure)
  - platform: template
    id: limiter_emergency_power_off
    name: "${limiter_name} emergency hard power off"
    icon: mdi:alert-octagon
    turn_on_action:
      - lambda: |-
          ESP_LOGE("limiter", "🛑 EMERGENCY HARD POWER OFF déclenché !");
          id(last_error) = "🛑 Emergency hard power OFF";
          id(charge_phase_text).publish_state("🛑 Emergency HARD OFF");
      - switch.turn_off: dps_output_sw
      - switch.turn_off: emerson_r48_dc_sw
      - switch.turn_off: emerson_r48_ac_sw
      - if:
          condition:
            lambda: "return id(modbus_ready);"
          then:
            - lambda: |-
                id(current_setting).make_call().set_value(0).perform();
                id(voltage_setting).make_call().set_value(${dps_voltage_default}).perform();
    turn_off_action:
      - lambda: |-
          ESP_LOGW("limiter", "⚠️ Emergency OFF relâché → retour mode normal");
          id(charge_phase_text).publish_state("Mode normal");
      - delay: 1s
      - lambda: "id(last_error) = \"Aucune erreur\";"

  # Forcer la charge (ignore Victron, mais NE PAS passer par handle_critical_error)
  - platform: template
    id: force_charge_switch
    name: "⚠️ Forcer charge (Ignorer Victron)"
    icon: mdi:flash-alert
    turn_on_action:
      - lambda: |-
          id(force_charge_mode) = true;
          ESP_LOGW("force", "⚠️ Mode Forcé ACTIVÉ – Victron ignoré pour l'autorisation de charge !");
          id(charge_phase_text).publish_state("⚠️ Mode forcé actif");
      - switch.turn_on: emerson_r48_ac_sw
      - delay: 2s
      - script.execute: start_sequence
    turn_off_action:
      - lambda: |-
          id(force_charge_mode) = false;
          ESP_LOGI("force", "✅ Mode Forcé désactivé – Retour au contrôle Victron");
          id(charge_phase_text).publish_state("Mode normal");

  # Emerson R48
  - platform: emerson_r48
    ac_sw:
      id: emerson_r48_ac_sw
      name: "R48 AC switch STOP"
      restore_mode: RESTORE_DEFAULT_OFF
    dc_sw:
      id: emerson_r48_dc_sw
      name: "R48 DC switch STOP"
      restore_mode: RESTORE_DEFAULT_OFF
    fan_sw:
      id: emerson_r48_fan_sw
      name: "R48 FAN MAX"
    led_sw:
      name: "R48 LED switch"

  # Lazy limiter modes
  - platform: lazy_limiter
    manual_mode:
      name: "${limiter_name} manual mode"

  # DPS output & keylock
  - platform: dps
    output:
      id: dps_output_sw
      name: "DPS output"
    key_lock:
      id: dps_keylock_sw
      name: "DPS key lock"

  # RAZ durée charge active
  - platform: template
    name: "RAZ durée charge active"
    icon: mdi:timer-refresh
    turn_on_action:
      - globals.set: { id: phase_active_time, value: "0" }

  # RAZ énergie batterie réelle
